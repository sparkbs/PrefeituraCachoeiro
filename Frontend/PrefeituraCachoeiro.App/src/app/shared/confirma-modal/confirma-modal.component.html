<h1 mat-dialog-title style="font-weight: bold; font-size: 20px; text-align: center;">Confirmação Contrato Global</h1>
<mat-dialog-content class="mat-typography">
  <p>Você realmente deseja criar um contrato Global?</p>
</mat-dialog-content>
<mat-dialog-actions >
  <button mat-button style="border: solid 1px; border-color: black;" (click)="voltar()">Voltar</button>
  <button mat-button style="border: solid 1px; border-color: black;" (click)="confirmar()">Confirmar</button>
</mat-dialog-actions>
