<div class="base-dados-body">
  <div class="table-body">
    <div>
      <mat-form-field>
        <mat-label>Filtro</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input>
      </mat-form-field>

      <button mat-button mat-stroked-button class="button-add" (click)="openEditarCriar()">
        <span>Adicionar recurso</span>
          <mat-icon>add</mat-icon>
      </button>
    </div>

    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" class="table">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
        </ng-container>

        <ng-container matColumnDef="origem">
          <th mat-header-cell *matHeaderCellDef> Origem </th>
          <td mat-cell *matCellDef="let element"> {{element.origem}} </td>
        </ng-container>

        <ng-container matColumnDef="unidade">
          <th mat-header-cell *matHeaderCellDef> Unidade </th>
          <td mat-cell *matCellDef="let element"> {{element.unidade}} </td>
        </ng-container>

        <ng-container matColumnDef="quantidade">
          <th mat-header-cell *matHeaderCellDef> Quantidade </th>
          <td mat-cell *matCellDef="let element"> {{element.quantidade}} </td>
        </ng-container>

        <ng-container matColumnDef="valorSemBdi">
          <th mat-header-cell *matHeaderCellDef> Valor s/ bdi </th>
          <td mat-cell *matCellDef="let element"> {{element.valorSemBdi}} </td>
        </ng-container>

        <ng-container matColumnDef="valorComBdi">
          <th mat-header-cell *matHeaderCellDef> Valor c/ bdi </th>
          <td mat-cell *matCellDef="let element"> {{element.valorComBdi}} </td>
        </ng-container>

        <ng-container matColumnDef="valor">
          <th mat-header-cell *matHeaderCellDef> Valor </th>
          <td mat-cell *matCellDef="let element"> {{element.valor}} </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef> </th>
          <td mat-cell *matCellDef="let element">
            <span matTooltip="Editar" (click)="openEditarCriar(true)">
              <mat-icon>edit</mat-icon>
            </span>

            <span matTooltip="Remover">
              <mat-icon>delete</mat-icon>
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 7]"
                     showFirstLastButtons
                     aria-label="Select page of periodic elements">
      </mat-paginator>
    </div>
  </div>
</div>
