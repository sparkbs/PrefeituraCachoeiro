<div class="grupos-permissoes-body">
  <div class="table-body">
    <div>
      <mat-form-field>
        <mat-label>Filtro</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input>
      </mat-form-field>

      <button mat-button mat-stroked-button class="button-add" (click)="openEditarCriar()">
        <span>Adicionar grupo</span>
          <mat-icon>add</mat-icon>
      </button>
    </div>

    <table mat-table [dataSource]="dataSource" class="table">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let grupo"> {{ grupo.nome }} </td>
      </ng-container>

      <ng-container matColumnDef="permissoes">
        <th mat-header-cell *matHeaderCellDef> Permissões </th>
        <td mat-cell *matCellDef="let grupo"> 
          {{ getPermissoes(grupo) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element">
            <span matTooltip="Editar" (click)="openEditarCriar(true, element.idGrupo)">
              <mat-icon>edit</mat-icon>
            </span>

            <span matTooltip="Remover" (click)="removeGroup(element.idGrupo)">
              <mat-icon>delete</mat-icon>
            </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 100]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
</div>
