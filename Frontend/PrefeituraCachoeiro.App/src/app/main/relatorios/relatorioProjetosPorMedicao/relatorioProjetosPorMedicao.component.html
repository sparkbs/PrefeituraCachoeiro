<div class="contratos-body">
  <mat-card class="card-content">
      <mat-card-header><span>Medições</span></mat-card-header>
      <mat-card-content>  
        <div >
          <h3>Informe um contrato para exibir as medições</h3>    
          <mat-form-field>
            <mat-label>Selecione a prefeitura</mat-label>
            <mat-select [(ngModel)]="selectedPrefeitura" disableRipple (selectionChange)="onSelectionChange($event.value)">
              <mat-option *ngFor="let prefeitura of listaPrefeitura" [value]="prefeitura.idPrefeitura" >{{prefeitura.nome}}</mat-option>
            </mat-select>
          </mat-form-field>   
          <mat-form-field style="margin-left: 5px;" [style.display]="exibirContrato ? '' : 'none'">
            <mat-label>Selecione o contrato</mat-label>
            <mat-select disableRipple [(ngModel)]="contratoSelecionado">
              <mat-option *ngFor="let contrato of listaContratos" [value]="contrato.idContrato" >{{contrato.numeroContrato}}</mat-option>
            </mat-select>
          </mat-form-field>  
          
            <button mat-button style="background-color:royalblue; color: white; margin-left: 10px;margin-top: -10px; " [style.display]="contratoSelecionado > 0 ? '' : 'none'" (click)="buscar()">Buscar</button>
            <button mat-button style="background-color:white; color: black; margin-left: 10px;margin-top: -10px; " [style.display]="contratoSelecionado > 0 ? '' : 'none'" (click)="limpar()">Limpar</button>
        </div>    
        <div class="mat-elevation-z8" [style.display]="exibir ? 'block' : 'none'">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px;">
            <div style="color: black;">
              <span matTooltip="Exibir Todos" style="cursor: pointer; margin-right: 10px;" (click)="openAllAccordions()">
                <mat-icon>playlist_add</mat-icon>
              </span>
              <span matTooltip="Ocultar Todos" style="cursor: pointer;" (click)="closeAllAccordions()">
                <mat-icon>eject</mat-icon>
              </span>
            </div>
            <div>
              <button mat-button style="background-color:royalblue; color: white; " (click)="openDialogConsolidado(medicaoProjetos[0].data[0])">Ver Consolidado Contrato</button>
              <button mat-button mat-stroked-button style="margin-left:10px; background-color:royalblue; color: white;" (click)="openDialog()">
                <span>Adicionar Medição</span>
                <mat-icon>add</mat-icon>
              </button>
            </div>
          </div>
          <mat-accordion class="example-headers-align" multi *ngFor="let medicoes of medicaoProjetos">                     
            <mat-expansion-panel>
              <mat-expansion-panel-header>
                <mat-panel-title> Medição {{medicoes.numeroMedicao}} </mat-panel-title>
                <mat-panel-description>
                  Ao expandir, devem ser exibidos todos os projetos medidos na medição {{medicoes.numeroMedicao}}
                </mat-panel-description>
              </mat-expansion-panel-header>
          
              <div *ngFor="let medicao of medicoes.data">
                <app-listaMedicao [medicoes]="medicao"></app-listaMedicao>              
              </div>

            </mat-expansion-panel>         
          </mat-accordion>
        </div>
      </mat-card-content>
  </mat-card>
</div>
