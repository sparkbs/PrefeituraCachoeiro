<div class="projetos-body">
  <mat-card class="card-content">
    <mat-card-header><span>Projetos</span></mat-card-header>
    <div class="table-body">
      <div>
        <mat-form-field>
          <mat-label>Filtro</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input>
        </mat-form-field>

        <button mat-button mat-stroked-button class="button-add" (click)="openEditarCriar()">
          <span>Adicionar projeto</span>
            <mat-icon>add</mat-icon>
        </button>
      </div>

      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" class="table">
          <ng-container matColumnDef="nomePrefeitura">
            <th mat-header-cell *matHeaderCellDef> Cliente </th>
            <td mat-cell *matCellDef="let element"> - </td>
          </ng-container>

          <ng-container matColumnDef="nomeContrato">
            <th mat-header-cell *matHeaderCellDef> Contrato </th>
            <td mat-cell *matCellDef="let element"> - </td>
          </ng-container>

          <ng-container matColumnDef="nomeProjeto">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let element"> {{element.nomeProjeto}} </td>
          </ng-container>

          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef> </th>
            <td mat-cell *matCellDef="let element">
              <span matTooltip="Editar" (click)="openEditarCriar(true, element.idProjeto)">
                <mat-icon>edit</mat-icon>
              </span>

              <span matTooltip="Remover" (click)="deleteProject(element.idProjeto)">
                <mat-icon>delete</mat-icon>
              </span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 7]"
                       showFirstLastButtons
                       aria-label="Select page of periodic elements">
        </mat-paginator>
      </div>
    </div>
  </mat-card>
</div>
