<h1 mat-dialog-title style="font-weight: bold; font-size: 20px; text-align: center;">Cadastrar contrato</h1>
<mat-dialog-content class="mat-typography">
  <div style="margin-top: 20px;">
    <div>

      <mat-form-field>
        <mat-label>Selecione a prefeitura</mat-label>
        <mat-select disableRipple [(ngModel)]="criarContrato.PrefeituraId">
          <mat-option *ngFor="let prefeitura of listaPrefeitura" [value]="prefeitura.idPrefeitura" >{{prefeitura.nome}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Data Contrato</mat-label>
        <input matInput type="date" [(ngModel)]="criarContrato.DataContrato" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Numero Contrato</mat-label>
        <input matInput [(ngModel)]="criarContrato.NumeroContrato"/>
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Tipo Contratação</mat-label>
        <mat-select [(ngModel)]="criarContrato.TipoContratacao" disableRipple>
          <mat-option [value]="1">Adesão</mat-option>
          <mat-option [value]="2">Licitação</mat-option>
        </mat-select>
      </mat-form-field>
      
    </div>
    <div>
      <mat-form-field>
        <mat-label>Data Inicio</mat-label>
        <input matInput type="date" [(ngModel)]="criarContrato.DataInicio" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Data Termino</mat-label>
        <input matInput type="date" [(ngModel)]="criarContrato.DataTermino"/>
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Gerente</mat-label>
        <input matInput [(ngModel)]="criarContrato.Gerente" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Valor Contrato</mat-label>
        <input matInput type="number" [(ngModel)]="criarContrato.Valor" />
      </mat-form-field>
    </div>
    <div>
      <div>
        Documentos:
      </div>
      <div>
        <input type="file" style="width:100%"/>
      </div>
    </div>
    
    
  </div>
</mat-dialog-content>
<mat-dialog-actions >
  <button mat-button (click)="salvar()" cdkFocusInitial>Salvar</button>
</mat-dialog-actions>
