<div class="register-container">
  <div class="card-register">
    <div class="logo-content">
      <img src="/assets/images/logos/logo_projeta_branca_290.png" alt="projeta" />
    </div>
    <p>Fazendo a diferença na vida das pessoas</p>
    <form class="form-register" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput>
      </mat-form-field>
      <button mat-raised-button color="primary">Cadastrar</button>
      <button mat-raised-button color="accent" class="btn-return" type="button" (click)="onReturn()">Voltar para tela inicial</button>
    </form>
  </div>
</div>
