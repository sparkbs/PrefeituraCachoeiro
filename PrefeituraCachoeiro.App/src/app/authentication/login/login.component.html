<div class="login-container">
  <div class="card-login">
    <div class="logo-content">
      <img src="/assets/images/logos/logo_projeta_branca_290.png" alt="projeta" />
    </div>
    <p>Fazendo a diferença na vida das pessoas</p>
    <form class="form-login" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput>
      </mat-form-field>
      <button mat-raised-button color="primary" class="btn-entrar">Entrar</button>
      <button mat-raised-button color="accent" class="btn-cadastrar" type="button" (click)="onRegister()">Cadastrar</button>
    </form>
  </div>
</div>
