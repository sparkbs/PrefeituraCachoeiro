<h1 mat-dialog-title style="font-weight: bold; font-size: 20px; text-align: center;">Cadastrar contrato</h1>
<mat-dialog-content class="mat-typography">
  <div style="margin-top: 20px;">
    <div>
      <mat-form-field>
        <mat-label>Nome prefeitura</mat-label>
        <input matInput  [(ngModel)]="contratos.nomePrefeitura" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Data Inicio e Fim</mat-label>
        <input matInput [(ngModel)]="contratos.dataInicioEFim" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Consórcio</mat-label>
        <input matInput [(ngModel)]="contratos.consorcio" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field>
        <mat-label>Gerente</mat-label>
        <input matInput [(ngModel)]="contratos.gerente" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Valor Contrato</mat-label>
        <input matInput [(ngModel)]="contratos.valorContrato" />
      </mat-form-field>

      <mat-form-field style="margin-left: 10px;">
        <mat-label>Tipo Contratacão</mat-label>
        <input matInput [(ngModel)]="contratos.tipoContratacao" />
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions >
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button (click)="salvar()" cdkFocusInitial>Salvar</button>
</mat-dialog-actions>
